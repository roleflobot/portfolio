experiment:
  name: "chunk-strategy-sweep"
  seed: 42

paths:
  document_dir: "../../data/public"
  golden_set_path: "../../data/public/public_paragraph_golden_set.json"
  persist_dir: "../chroma_db"
  result_dir: "./outputs"

embedding:
  model_name: "gemini-embedding-2"

generation:
  model_name: "gemini-3.6-flash"
  temperature: 0.0

chunking:
  matrix:
    - {chunk_size: 500, chunk_overlap: 50}
    - {chunk_size: 700, chunk_overlap: 100}
    - {chunk_size: 1000, chunk_overlap: 150}

retrieval:
  # 실습 노트북(10-rag-evaluation-practice)의 검색기 설정과 동일하게 맞춤.
  # 노트북: as_retriever(search_kwargs={"k": 5}) / mmr {"k":5,"fetch_k":20,"lambda_mult":0.5}
  fetch_k: 5
  strategies: ["similarity", "mmr"]  # 실습 요구 범위. bm25/hybrid는 구현되어 있으나 미사용
  mmr:
    fetch_k_candidates: 20
    lambda_mult: 0.5
  hybrid:
    weight_similarity: 0.5
    weight_bm25: 0.5

rerank:
  enabled_options: [false, true]
  top_k: 5

evaluation:
  k_values:
    file: [1]
    page: [1, 3, 5]
  sample_limit: null
  sample_seed: 42

cost:
  currency: "USD"
  pricing:
    input_usd_per_1k_tokens: 0.000075
    output_usd_per_1k_tokens: 0.0003

runtime:
  retry:
    attempts: 8
    initial_delay: 2.0
    max_delay: 60.0
    exp_base: 2
    jitter: 1.0
